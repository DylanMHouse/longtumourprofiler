# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "methylation_calling"
description: Classify a tumour methylation profile from a modkit bedMethyl with the nanoDx neural network
keywords:
  - methylation
  - bedmethyl
  - liftover
  - classification
  - nanopore
components:
  - liftover/liftover
  - bedtools/intersect
  - nanodx/classify
input:
  - ch_bedmethyl:
      type: file
      description: |
        modkit pileup bedMethyl on the assembly the reads were aligned to
        Structure: [ val(meta), path(bedmethyl) ]
      pattern: "*.{bed,bed.gz}"
  - ch_chain:
      type: file
      description: |
        liftOver chain from the aligned assembly to the probe assembly
        Structure: [ val(meta), path(chain) ]
      pattern: "*.{chain,chain.gz}"
  - ch_probes:
      type: file
      description: |
        BED6 of methylation array probes with the probe ID in the name column
        Structure: [ val(meta), path(bed) ]
      pattern: "*.bed"
  - ch_model:
      type: file
      description: |
        Pickled nanoDx neural network model
        Structure: [ val(meta), path(pkl) ]
      pattern: "*.pkl"
output:
  - bedmethyl:
      type: file
      description: |
        Lifted bedMethyl (BED9+2) restricted to probe sites, with the probe ID as the name
        Structure: [ val(meta), path(bed) ]
      pattern: "*.bed"
  - votes:
      type: file
      description: |
        Score of every methylation class, highest first
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.votes.tsv"
  - summary:
      type: file
      description: |
        Predicted class, its score and the number of features used
        Structure: [ val(meta), path(txt) ]
      pattern: "*.summary.txt"
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
