# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bamcallsomaticclairsdeepsomatic"
description: Call somatic small variants from a matched tumour-normal BAM pair with ClairS, DeepSomatic and DeepVariant
keywords:
  - somatic
  - variant calling
  - clairs
  - deepsomatic
  - deepvariant
components:
  - clairs
  - bcftools/merge
  - deepsomatic
  - parabricks/deepvariant
input:
  - ch_tumour_normal:
      type: file
      description: |
        Paired tumour and normal BAM files with their indexes
        Structure: [ val(tumour_meta), path(tumour_bam), path(tumour_bai), val(normal_meta), path(normal_bam), path(normal_bai) ]
      pattern: "*.bam"
  - ch_fasta_fai:
      type: file
      description: |
        Reference genome with its index
        Structure: [ val(meta), path(fasta), path(fai) ]
      pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
output:
  - clairs_vcf:
      type: file
      description: |
        Merged SNV and indel calls from ClairS
        Structure: [ val(meta), path(vcf.gz) ]
      pattern: "*.vcf.gz"
  - clairs_tbi:
      type: file
      description: |
        Index of the merged ClairS calls
        Structure: [ val(meta), path(vcf.gz.tbi) ]
      pattern: "*.vcf.gz.tbi"
  - deepsomatic_vcf:
      type: file
      description: |
        Somatic variant calls from DeepSomatic
        Structure: [ val(meta), path(vcf.gz) ]
      pattern: "*.vcf.gz"
  - deepsomatic_tbi:
      type: file
      description: |
        Index of the DeepSomatic variant calls
        Structure: [ val(meta), path(vcf.gz.tbi) ]
      pattern: "*.vcf.gz.tbi"
  - deepvariant_vcf:
      type: file
      description: |
        Variant calls from DeepVariant
        Structure: [ val(meta), path(vcf.gz) ]
      pattern: "*.vcf.gz"
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
