# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_call_cnv_spectre"
description: Call large copy number variants from long-read alignments with Spectre,
  from mosdepth binned coverage and SNV calls.
keywords:
  - cnv
  - spectre
  - long-read
components:
  - mosdepth
  - spectre/cnvcaller
input:
  - ch_input:
      type: file
      description: |
        Aligned reads
        Structure: [ val(meta), path(bam), path(bai) ]
      pattern: "*.{bam,bai}"
  - ch_snv:
      type: file
      description: |
        SNV calls for the same samples (e.g. from Clair3)
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.{vcf,vcf.gz}"
  - ch_fasta:
      type: file
      description: |
        Reference genome
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta}"
  - ch_spectre_metadata:
      type: file
      description: |
        Spectre N-region metadata, or [] to build it from the fasta
        Structure: path(mdr)
      pattern: "*.mdr"
  - ch_spectre_blacklist:
      type: file
      description: |
        Regions for Spectre to ignore, or []
        Structure: path(bed)
      pattern: "*.bed"
output:
  - cnv_vcf:
      type: file
      description: |
        Spectre CNV calls
        Structure: [ val(meta), path(vcf) ]
      pattern: "*_cnv.vcf"
  - cnv_bed:
      type: file
      description: |
        Spectre CNV calls in BED format
        Structure: [ val(meta), path(bed) ]
      pattern: "*_cnv.bed"
  - karyotype:
      type: file
      description: |
        Spectre predicted sex chromosome karyotype
        Structure: [ val(meta), path(txt) ]
      pattern: "*_predicted_karyotype.txt"
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
