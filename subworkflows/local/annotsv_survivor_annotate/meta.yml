# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "annotsv_survivor_annotate"
description: Keep the PASS SAVANA somatic SVs, merge them with the Severus somatic SVs using SURVIVOR, sort the merged VCF and annotate it with AnnotSV.
keywords:
  - structural variants
  - sv
  - merge
  - annotation
  - nanopore
components:
  - bcftools/view
  - survivor/merge
  - bcftools/sort
  - annotsv/annotsv
input:
  - ch_savana_severus:
      type: file
      description: |
        Uncompressed somatic SV VCFs from SAVANA and Severus for each tumour
        Structure: [ val(meta), path(savana_vcf), path(severus_vcf) ]
      pattern: "*.vcf"
  - ch_annotations:
      type: directory
      description: |
        AnnotSV annotations directory
        Structure: [ val(meta2), path(annotations) ]
output:
  - savana_pass_vcf:
      type: file
      description: |
        SAVANA SVs with FILTER=PASS
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf"
  - merged_vcf:
      type: file
      description: |
        Sorted SURVIVOR merge of the Severus and PASS SAVANA SVs
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf"
  - annotsv_tsv:
      type: file
      description: |
        AnnotSV annotation table of the merged SVs
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.tsv"
  - annotsv_vcf:
      type: file
      description: |
        AnnotSV annotated VCF (when -vcf 1 is passed to AnnotSV)
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf"
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
