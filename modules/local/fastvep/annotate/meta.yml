tools:
  ## TODO nf-core: Add a description and other details for the software below
  - "fastvep":
      description: "A high-performance variant effect predictor with clinical database integration, written in Rust"
      homepage: "https://github.com/Huang-lab/fastVEP/blob/v0.4.0/README.md"
      documentation: "https://github.com/Huang-lab/fastVEP/blob/v0.4.0/README.md"
      tool_dev_url: "https://github.com/Huang-lab/fastVEP"
      doi: ""
      licence: ["Apache-2.0"]
      identifier: null

input:
  ### TODO nf-core: Add a description of all of the variables used as input
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_2573" # CRAM
          - edam: "http://edamontology.org/format_3462" # SAM

output:
  ### TODO nf-core: Add a description of all of the variables used as output
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.bam":
          type: file
          description: Sorted BAM/CRAM/SAM file
          pattern: "*.{bam,cram,sam}"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
            - edam: "http://edamontology.org/format_2573" # CRAM
            - edam: "http://edamontology.org/format_3462" # SAM
  versions_fastvep:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fastvep":
          type: string
          description: The name of the tool
      - "fastvep --version":
          type: eval
          description: The expression to obtain the version of the tool

