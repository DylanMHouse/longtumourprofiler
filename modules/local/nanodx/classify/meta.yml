name: "nanodx_classify"
description: Predict the methylation class of a tumour from a probe-annotated bedMethyl file using the nanoDx neural network classifier
keywords:
  - methylation
  - classification
  - nanopore
  - tumour
  - neural network
tools:
  - "nanodx":
      description: "End-to-end pipeline for DNA methylation-based classification of tumours from nanopore sequencing data"
      homepage: "https://gitlab.com/pesk/nanoDx"
      documentation: "https://gitlab.com/pesk/nanoDx"
      tool_dev_url: "https://gitlab.com/pesk/nanoDx"
      doi: "10.1038/s41591-023-02518-x"
      licence: null
      identifier: null

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bedmethyl:
        type: file
        description: |
          bedMethyl file (BED9+2) whose name column holds the Illumina probe ID
          of each CpG site, e.g. from intersecting with a probe annotation BED
        pattern: "*.{bed,bedMethyl}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
  - - meta2:
        type: map
        description: |
          Groovy Map containing model information
          e.g. `[ id:'Capper_et_al' ]`
    - model:
        type: file
        description: Pickled nanoDx neural network model (weights, label encoder and input features)
        pattern: "*.pkl"
        ontologies: []
output:
  votes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.votes.tsv":
          type: file
          description: Table of methylation classes with their scores, sorted by descending score, and the number of features used
          pattern: "*.votes.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.summary.txt":
          type: file
          description: Summary with the number of features, the predicted class and its score
          pattern: "*.summary.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  versions_pytorch:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "pytorch":
          type: string
          description: The name of the tool
      - "python -c 'import torch; print(torch.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pytorch:
          type: string
          description: The name of the tool
      - "python -c 'import torch; print(torch.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
