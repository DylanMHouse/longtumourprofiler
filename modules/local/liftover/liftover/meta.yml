name: "liftover_liftover"
description: Convert the coordinates of a bedMethyl file between genome assemblies with UCSC liftOver
keywords:
  - liftover
  - methylation
  - bedmethyl
  - assembly
  - epigenetics
  - ucsc
tools:
  - "liftover":
      description: "UCSC liftOver moves annotations from one genome assembly to another using a chain file."
      homepage: "https://genome.ucsc.edu/cgi-bin/hgLiftOver"
      documentation: "https://genome.ucsc.edu/goldenPath/help/hgTracksHelp.html#Liftover"
      tool_dev_url: "https://github.com/ucscGenomeBrowser/kent"
      doi: "10.1093/nar/gkj144"
      licence: ["varies; see http://genome.ucsc.edu/license"]
      identifier: ""
      args_id: "$args"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - methyl:
        type: file
        description: bedMethyl file with coordinates on the source assembly
        pattern: "*.{bed,bedMethyl,bedmethyl}"
        ontologies:
          - edam: "http://edamontology.org/format_3003" # BED
  - bedPlus:
      type: integer
      description: |
        Number of leading columns that liftOver parses as standard BED fields.
        liftOver copies the remaining columns to the output unchanged.
        Passed to the `-bedPlus` option.
  - - meta2:
        type: map
        description: |
          Groovy Map containing chain file information
          e.g. `[ id:'hg19ToHg38' ]`
    - chain:
        type: file
        description: Chain file describing the alignment from the source assembly to the target assembly
        pattern: "*.{chain,chain.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3982" # CHAIN

output:
  mapped:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.bedMethyl":
          type: file
          description: bedMethyl file with records lifted to the target assembly
          pattern: "*.bedMethyl"
          ontologies:
            - edam: "http://edamontology.org/format_3003" # BED
  versions_ucsc:
    - - "${task.process}":
          type: string
          description: The name of the process
      - ucsc:
          type: string
          description: The name of the tool
      - "482":
          type: string
          description: The version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - ucsc:
          type: string
          description: The name of the tool
      - "482":
          type: string
          description: The version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
