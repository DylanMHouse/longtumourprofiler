# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "mafsmith_fetch"
description: Download the Ensembl gene GFF3 that mafsmith vcf2maf needs for fastVEP annotation
keywords:
  - maf
  - annotation
  - gff3
  - reference
tools:
  - "mafsmith":
      description: Fast, self-contained VCF to MAF converter using fastVEP annotation
      homepage: "https://github.com/nf-osi/mafsmith"
      documentation: "https://github.com/nf-osi/mafsmith"
      tool_dev_url: "https://github.com/nf-osi/mafsmith"
      doi: ""
      licence: null
      identifier: null

input:
  - genome:
      type: string
      description: mafsmith genome name, one of grch38, grch37 or grcm39
output:
  gff3:
    - "mafsmith_data/*/genes.gff3.gz":
        type: file
        description: Ensembl gene annotation GFF3 for mafsmith vcf2maf --gff3
        pattern: "genes.gff3.gz"
        ontologies:
          - edam: "http://edamontology.org/format_1975" # GFF3
  versions_mafsmith:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mafsmith:
          type: string
          description: The name of the tool
      - mafsmith --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mafsmith:
          type: string
          description: The name of the tool
      - mafsmith --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
