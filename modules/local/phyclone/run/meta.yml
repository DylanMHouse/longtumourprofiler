name: "phyclone_run"
description: |
  Samples clone trees with PhyClone from the PyClone-VI input table, using the PyClone-VI
  clusters as fixed mutation clusters. Writes the MCMC trace used by phyclone map and
  phyclone topology-report.
keywords:
  - clonal evolution
  - phylogeny
  - tumour heterogeneity
  - phyclone
tools:
  - "phyclone":
      description: |
        Bayesian method for phylogenetic reconstruction of tumour clones from bulk sequencing,
        using allele counts, allele-specific copy number and pre-computed mutation clusters.
      homepage: "https://github.com/Roth-Lab/PhyClone"
      documentation: "https://github.com/Roth-Lab/PhyClone"
      tool_dev_url: "https://github.com/Roth-Lab/PhyClone"
      licence: ["GPL v3"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - tsv:
        type: file
        description: |
          PyClone-VI input table (mutation_id, sample_id, ref_counts, alt_counts, normal_cn,
          major_cn, minor_cn, tumour_content and chrom). PhyClone uses chrom to find clusters
          that may have been lost.
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - clusters:
        type: file
        description: PyClone-VI results table, used as the cluster file (mutation_id, sample_id, cluster_id, cellular_prevalence)
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV

output:
  trace:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.phyclone_trace.h5":
          type: file
          description: MCMC trace of all chains
          pattern: "*.phyclone_trace.h5"
          ontologies:
            - edam: http://edamontology.org/format_3590 # HDF5
  versions_phyclone:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "phyclone":
          type: string
          description: The name of the tool
      - "phyclone --version | sed 's/.*version //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - phyclone:
          type: string
          description: The name of the tool
      - "phyclone --version | sed 's/.*version //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
