name: "phyclone_plottree"
description: |
  Draws the PhyClone MAP tree with one node per clone, labelled with its number of SNVs.
  Uses plot_phyclone_tree.py adapted from PhyClone-Workflow (GPL-3.0).
keywords:
  - clonal evolution
  - phylogeny
  - plot
  - phyclone
tools:
  - "plot_phyclone_tree.py":
      description: Tree plot script from PhyClone-Workflow, drawn with Graphviz
      homepage: "https://github.com/Roth-Lab/PhyClone-Workflow"
      documentation: "https://github.com/Roth-Lab/PhyClone-Workflow"
      tool_dev_url: "https://github.com/Roth-Lab/PhyClone-Workflow"
      licence: ["GPL v3"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - tree:
        type: file
        description: MAP clone tree from phyclone map
        pattern: "*.nwk"
        ontologies:
          - edam: http://edamontology.org/format_1910 # newick
    - table:
        type: file
        description: MAP results table from phyclone map (clone_id and mutation_id columns)
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV

output:
  png:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.phyclone_map_tree.png":
          type: file
          description: MAP clone tree plot
          pattern: "*.phyclone_map_tree.png"
          ontologies:
            - edam: http://edamontology.org/format_3603 # PNG
  versions_graphviz:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "graphviz":
          type: string
          description: The name of the tool
      - "dot -V 2>&1 | sed 's/.*version \\([^ ]*\\).*/\\1/'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_scikit_bio:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "scikit-bio":
          type: string
          description: The name of the tool
      - "python -c 'import skbio; print(skbio.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - graphviz:
          type: string
          description: The name of the tool
      - "dot -V 2>&1 | sed 's/.*version \\([^ ]*\\).*/\\1/'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - scikit-bio:
          type: string
          description: The name of the tool
      - "python -c 'import skbio; print(skbio.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
