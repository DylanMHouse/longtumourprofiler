name: "phyclone_topologyreport"
description: Summarises every unique tree topology sampled in a PhyClone trace.
keywords:
  - clonal evolution
  - phylogeny
  - tree topology
  - phyclone
tools:
  - "phyclone":
      description: |
        Bayesian method for phylogenetic reconstruction of tumour clones from bulk sequencing,
        using allele counts, allele-specific copy number and pre-computed mutation clusters.
      homepage: "https://github.com/Roth-Lab/PhyClone"
      documentation: "https://github.com/Roth-Lab/PhyClone"
      tool_dev_url: "https://github.com/Roth-Lab/PhyClone"
      licence: ["GPL v3"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - trace:
        type: file
        description: PhyClone MCMC trace from phyclone run
        pattern: "*.phyclone_trace.h5"
        ontologies:
          - edam: http://edamontology.org/format_3590 # HDF5

output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.phyclone_topology_report.tsv":
          type: file
          description: One row per unique topology with its log probability, number of nodes and sample count
          pattern: "*.phyclone_topology_report.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  archive:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.phyclone_topologies.tar.gz":
          type: file
          description: |
            Newick tree, results table and sample prevalence table for each topology.
            Limited to the most frequent topologies with --top-trees in ext.args.
          pattern: "*.phyclone_topologies.tar.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_phyclone:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "phyclone":
          type: string
          description: The name of the tool
      - "phyclone --version | sed 's/.*version //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - phyclone:
          type: string
          description: The name of the tool
      - "phyclone --version | sed 's/.*version //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
