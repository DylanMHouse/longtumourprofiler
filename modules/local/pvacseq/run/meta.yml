# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pvacseq_run"
description: Predict neoantigens from a VEP-annotated somatic VCF and a set of
  HLA alleles with pVACseq
keywords:
  - neoantigen
  - hla
  - mhc
  - somatic
  - vcf
  - immunotherapy
tools:
  - "pvactools":
      description: "A cancer immunotherapy tools suite for identifying and
        prioritising neoantigens."
      homepage: "https://pvactools.readthedocs.io/"
      documentation: "https://pvactools.readthedocs.io/en/latest/pvacseq.html"
      tool_dev_url: "https://github.com/griffithlab/pVACtools"
      doi: "10.1158/2326-6066.CIR-19-0401"
      licence: ["BSD-3-Clause-Clear"]
      identifier: null

input:
  - - meta:
        type: map
        description: Groovy Map containing tumour sample information. e.g. `[
          id:'sample1' ]`. The id must match the tumour sample column of the VCF.
    - vcf:
        type: file
        description: Somatic VCF annotated by VEP with the Frameshift and
          Wildtype plugins
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3016" # VCF
    - hla_alleles:
        type: string
        description: Comma-separated HLA alleles, e.g. `HLA-A*02:01,HLA-B*07:02`
          for class I or `DRB1*15:01` for class II
  - algorithms:
      type: string
      description: Space-separated binding prediction algorithms, e.g.
        `NetMHCpanEL NetMHCpan MHCflurry`
output:
  outdir:
    - - meta:
          type: map
          description: Groovy Map containing tumour sample information. e.g. `[
            id:'sample1' ]`
      - MHC_Class_*:
          type: directory
          description: pVACseq output directory per MHC class
          pattern: "MHC_Class_{I,II}"
  all_epitopes:
    - - meta:
          type: map
          description: Groovy Map containing tumour sample information. e.g. `[
            id:'sample1' ]`
      - MHC_Class_*/*.all_epitopes.tsv:
          type: file
          description: Unfiltered binding predictions for every epitope
          pattern: "*.all_epitopes.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  aggregated:
    - - meta:
          type: map
          description: Groovy Map containing tumour sample information. e.g. `[
            id:'sample1' ]`
      - MHC_Class_*/*.all_epitopes.aggregated.tsv:
          type: file
          description: Best epitope per variant with an evidence tier
          pattern: "*.all_epitopes.aggregated.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  filtered:
    - - meta:
          type: map
          description: Groovy Map containing tumour sample information. e.g. `[
            id:'sample1' ]`
      - MHC_Class_*/*.filtered.tsv:
          type: file
          description: Epitopes passing the binding, coverage and transcript
            support filters
          pattern: "*.filtered.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_pvactools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pvactools:
          type: string
          description: The name of the tool
      - python -c 'from importlib.metadata import version; print(version("pvactools"))':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pvactools:
          type: string
          description: The name of the tool
      - python -c 'from importlib.metadata import version; print(version("pvactools"))':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@DylanMHouse"
maintainers:
  - "@DylanMHouse"
