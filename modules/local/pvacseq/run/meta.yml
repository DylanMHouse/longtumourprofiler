name: "pvacseq_run"
description: write your description here
keywords:
  - sort
  - example
  - genomics
tools:
  ## TODO nf-core: Add a description and other details for the software below
  - "pvacseq":
      description: "Personalized Variant Antigens by Cancer Sequencing (pVAC-Seq)"
      homepage: "http://pvac-seq.readthedocs.io/"
      documentation: "http://pvac-seq.readthedocs.io/"
      tool_dev_url: "None"
      doi: ""
      licence: ["NPOSL-3.0"]
      identifier: null

input:
  ### TODO nf-core: Add a description of all of the variables used as input
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_2573" # CRAM
          - edam: "http://edamontology.org/format_3462" # SAM

output:
  ### TODO nf-core: Add a description of all of the variables used as output
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.bam":
          type: file
          description: Sorted BAM/CRAM/SAM file
          pattern: "*.{bam,cram,sam}"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
            - edam: "http://edamontology.org/format_2573" # CRAM
            - edam: "http://edamontology.org/format_3462" # SAM
  versions_pvacseq:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "pvacseq":
          type: string
          description: The name of the tool
      - "pvacseq --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
